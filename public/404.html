<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link not found — Shortly</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .not-found { max-width: 520px; text-align: center; }
      .not-found strong { color: var(--gold); font-family: Manrope, sans-serif; font-size: 100px; letter-spacing: -8px; line-height: 1; }
      .not-found h1 { margin: 10px 0; font-size: 34px; letter-spacing: -1.5px; }
      .not-found p { margin: 0 0 28px; color: var(--muted); }
      .not-found a { display: inline-flex; padding: 13px 20px; color: white; background: var(--gold); border-radius: 10px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <strong>404</strong>
      <h1>This link has gone missing.</h1>
      <p>It may have expired, been removed, or never existed.</p>
      <a href="/">Create a new short link</a>
    </main>
  </body>
</html>
